{% extends "base.html" %}
{% block title %}Sorğular{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4">Sorğular</h1>
  <a class="btn btn-primary" href="{{ url_for('polls.new') }}">Yeni sorğu</a>
</div>

<div class="list-group">
  {% for p in polls %}
  <a class="list-group-item list-group-item-action" href="{{ url_for('polls.detail', poll_id=p.id) }}">
    <div class="d-flex justify-content-between align-items-center">
      <div class="me-3">
        <strong>{{ p.question }}</strong>
        {# created_at əlavə edəndə buraya göstərəcəyik #}
      </div>
      <span class="badge bg-{{ 'secondary' if p.is_closed else 'success' }}">
        {{ 'Bağlı' if p.is_closed else 'Açıq' }}
      </span>
    </div>
  </a>
  {% else %}
  <div class="text-muted">Hələ sorğu yoxdur.</div>
  {% endfor %}
</div>
{% endblock %}
